spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL_USER_SERVICE:jdbc:postgresql://localhost:5432/wefit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Jatin1307@}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate.format_sql: true
    generate-ddl: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
