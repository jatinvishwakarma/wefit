spring:
  application:
    name: activity-service
  data:
    mongodb:
      uri: ${MONGODB_URI_ACTIVITY_SERVICE:mongodb://localhost:27017/WefitActivitydb}
      database: ${MONGODB_DATABASE_ACTIVITY_SERVICE:WefitActivitydb}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.add.type.headers: false

kafka:
  topic:
    name: ${KAFKA_TOPIC_NAME:activity-events}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
