spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_CERTS_URL:http://localhost:8090/realms/wefit/protocol/openid-connect/certs}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-User-Id
            maxAge: 3600
      default-filters:
        - name: RequestSize
          args:
            maxSize: 5000000
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**, /api/v1/users/**, /api/v1/leaderboard/**
        - id: user-service-deprecated
          uri: lb://user-service
          predicates:
            - Path=/api/user/**, /api/users/**, /api/leaderboard/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - SetResponseHeader=Deprecation, true
        - id: activity-service-v1
          uri: lb://activity-service
          predicates:
            - Path=/api/v1/activity/**, /api/v1/activities/**, /api/v1/challenges/**
        - id: activity-service-deprecated
          uri: lb://activity-service
          predicates:
            - Path=/api/activity/**, /api/activities/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - SetResponseHeader=Deprecation, true
        - id: ai-service-v1
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**, /api/v1/recommendations/**
        - id: ai-service-deprecated
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**, /api/recommendations/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - SetResponseHeader=Deprecation, true
        - id: relationship-service-v1
          uri: lb://relationship-service
          predicates:
            - Path=/api/v1/relationships/**, /api/v1/follows/**
        - id: media-service-v1
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**
        - id: moderation-service-v1
          uri: lb://moderationService
          predicates:
            - Path=/api/v1/moderation/**
        - id: openapi-user-service
          uri: lb://user-service
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/(?<segment>.*), /$\{segment}
        - id: openapi-activity-service
          uri: lb://activity-service
          predicates:
            - Path=/activity-service/v3/api-docs
          filters:
            - RewritePath=/activity-service/(?<segment>.*), /$\{segment}
        - id: openapi-ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai-service/v3/api-docs
          filters:
            - RewritePath=/ai-service/(?<segment>.*), /$\{segment}
        - id: openapi-relationship-service
          uri: lb://relationship-service
          predicates:
            - Path=/relationship-service/v3/api-docs
          filters:
            - RewritePath=/relationship-service/(?<segment>.*), /$\{segment}
        - id: openapi-media-service
          uri: lb://media-service
          predicates:
            - Path=/media-service/v3/api-docs
          filters:
            - RewritePath=/media-service/(?<segment>.*), /$\{segment}
        - id: openapi-moderation-service
          uri: lb://moderationService
          predicates:
            - Path=/moderation-service/v3/api-docs
          filters:
            - RewritePath=/moderation-service/(?<segment>.*), /$\{segment}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: activity-service
        url: /activity-service/v3/api-docs
      - name: ai-service
        url: /ai-service/v3/api-docs
      - name: relationship-service
        url: /relationship-service/v3/api-docs
      - name: media-service
        url: /media-service/v3/api-docs
      - name: moderation-service
        url: /moderation-service/v3/api-docs

server:
  port: 8443
  # ssl:
#     key-store: file:../certs/keystore.p12
#     key-store-password: changeit
#     key-store-type: PKCS12
#     key-alias: wefit

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    secure-port-enabled: true
    non-secure-port-enabled: false

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.reactive.DispatcherHandler: TRACE
    org.springframework.cloud.loadbalancer: TRACE

user-service:
  base-url: https://localhost:8081
