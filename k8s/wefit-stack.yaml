# Ingress Controller Config
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wefit-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /()(.*)
        pathType: Prefix
        backend:
          service:
            name: wefit-web
            port:
              number: 80
